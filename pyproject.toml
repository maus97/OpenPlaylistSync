[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-playlist-sync"
version = "0.1.0"
description = "Privacy-first, self-hosted bidirectional playlist synchronization."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.10,<4",
    "authlib>=1.3,<2",
    "cryptography>=50,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9,<2",
    "pip-audit>=2.10,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
ops = "ops.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
