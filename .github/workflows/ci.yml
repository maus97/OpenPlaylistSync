name: CI

on:
  push:
    branches: [main, security/remediation]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.7"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==$UV_VERSION"

      - name: Install locked project and development dependencies
        run: uv sync --frozen --all-extras

      - name: Check target environment
        run: uv run --frozen python scripts/check_environment.py --strict-python

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Static security analysis
        run: uv run --frozen bandit -q -r src

      - name: Audit locked runtime dependencies
        run: uv run --frozen pip-audit --require-hashes -r requirements.lock

      - name: Test
        run: uv run --frozen pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --redact --no-banner --exit-code=1

  container:
    runs-on: ubuntu-latest
    needs: [quality, secrets]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag open-playlist-sync:ci .

      - name: Scan image for Critical and High vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed
          open-playlist-sync:ci
